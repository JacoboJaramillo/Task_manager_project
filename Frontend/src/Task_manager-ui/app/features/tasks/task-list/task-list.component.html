<div class="overflow-hidden rounded-2xl shadow-lg border border-gray-200 bg-white">
<table class="min-w-full bg-white rounded-2xl overflow-hidden">
    <thead class="bg-slate-800 text-white">
        <tr>
            <th class="px-6 py-4 text-left font-semibold">Título</th>
            <th class="px-6 py-4 text-left font-semibold">Prioridad</th>
            <th class="px-6 py-4 text-left font-semibold">Estado</th>
            <th class="px-6 py-4 text-center font-semibold">Acciones</th>
        </tr>
    </thead>

    @if(tareas$ | async; as Tasks){
    <tbody class="divide-y divide-gray-100">
        @for(tarea of Tasks; track tarea.id){
        <tr class="hover:bg-blue-50 transition-colors duration-550">

            <td class="px-6 py-4 font-medium text-gray-800">
                {{ tarea.title }}
            </td>

            <td class="px-6 py-4">
                <span
                    class="px-3 py-1 rounded-full text-xs font-semibold"
                    [ngClass]="{
                        'bg-red-100 text-red-700': tarea.priority === 'High',
                        'bg-yellow-100 text-yellow-700': tarea.priority === 'Medium',
                        'bg-green-100 text-green-700': tarea.priority === 'Low'
                    }">
                    {{ tarea.priority }}
                </span>
            </td>

            <td class="px-6 py-4">
                <span
                    class="px-3 py-1 rounded-full text-xs font-semibold"
                    [ngClass]="{
                        'bg-green-100 text-green-700': tarea.isCompleted,
                        'bg-gray-100 text-gray-700': !tarea.isCompleted
                    }">- 

                    {{ tarea.isCompleted ? 'Completada' : 'Pendiente' }}

                </span>
            </td>

            <td class="px-6 py-4 text-center">

                <button
                    class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg text-sm font-medium shadow-sm transition-all duration-200"
                    (click)="eliminarTarea(tarea.id, tarea)">
                    Eliminar
                </button>

            </td>

        </tr>
        }
    </tbody>
    }
</table>
</div>
