<div class="overflow-hidden rounded-2xl shadow-2xl border border-gray-700 bg-gray-800 max-w-5xl mx-auto p-4 md:p-6">
  
  <h2 class="text-white text-xl font-bold mb-4 px-2">Mis Tareas</h2>

  @if(tareas$ | async; as Tasks){
    
    <table class="w-full min-w-full text-left border-collapse">
      
      <thead class="bg-gray-900 text-gray-300 uppercase text-xs tracking-wider hidden md:table-header-group">
        <tr>
          <th class="px-6 py-4 font-semibold">Título</th>
          <th class="px-6 py-4 font-semibold">Prioridad</th>
          <th class="px-6 py-4 font-semibold">Estado</th>
          <th class="px-6 py-4 font-semibold text-center">Acciones</th>
        </tr>
      </thead>

      <tbody class="divide-y divide-gray-700 block md:table-row-group">
        @for(tarea of Tasks; track tarea.id){
          <tr class="hover:bg-gray-750/50 transition-colors duration-200 block md:table-row py-4 md:py-0 space-y-3 md:space-y-0">
            
            <td class="px-4 md:px-6 md:py-4 font-medium text-white block md:table-cell">
              <span class="text-xs text-gray-500 font-bold uppercase block md:hidden mb-1">Título</span>
              <span class="text-base md:text-sm">{{ tarea.title }}</span>
            </td>

            <td class="px-4 md:px-6 md:py-4 block md:table-cell">
              <span class="text-xs text-gray-500 font-bold uppercase block md:hidden mb-1">Prioridad</span>
              <span class="px-3 py-1 rounded-full text-xs font-semibold inline-block"
                [ngClass]="{
                  'bg-red-900/40 text-red-400 border border-red-800/60': tarea.priority === 'High',
                  'bg-yellow-900/40 text-yellow-400 border border-yellow-800/60': tarea.priority === 'Medium',
                  'bg-green-900/40 text-green-400 border border-green-800/60': tarea.priority === 'Low'
                }">
                {{ tarea.priority }}
              </span>
            </td>

            <td class="px-4 md:px-6 md:py-4 block md:table-cell">
              <span class="text-xs text-gray-500 font-bold uppercase block md:hidden mb-1">Estado</span>
              <span class="px-3 py-1 rounded-full text-xs font-semibold inline-block"
                [ngClass]="{
                  'bg-emerald-900/40 text-emerald-400 border border-emerald-800/60': tarea.isCompleted,
                  'bg-zinc-700/50 text-zinc-400 border border-zinc-600': !tarea.isCompleted
                }">
                {{ tarea.isCompleted ? 'Completada' : 'Pendiente' }}
              </span>
            </td>

            <td class="px-4 md:px-6 md:py-4 text-left md:text-center block md:table-cell pt-2 md:pt-0">
              <span class="text-xs text-gray-500 font-bold uppercase block md:hidden mb-2">Acciones</span>
              <button (click)="eliminarTarea(tarea.id, tarea)"
                class="w-full md:w-auto bg-red-600 hover:bg-red-700 text-white font-medium px-4 py-2 rounded-lg text-xs md:text-sm transition-all shadow-md shadow-red-900/20 active:scale-95">
                Eliminar
              </button>
              <button (click)="editarTarea(tarea)"class="w-full md:w-auto bg-amber-600 hover:bg-amber-700 text-white font-medium px-4 py-2 rounded-lg text-xs md:text-sm transition-all shadow-md shadow-red-900/20 active:scale-95"
              >
                Editar
              </button>
            </td>

          </tr>
        }
      </tbody>
    </table>

  }
</div>
