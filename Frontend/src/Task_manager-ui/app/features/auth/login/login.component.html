<form (ngSubmit)="loginUsuario()" #loginForm="ngForm">
    <div class="row">
        <div class=" columns-md-4 mb-3">
            <label class="form-label fw-bold">Correo</label>
            <input type="text" class="form-control" name="correo" [(ngModel)]="credenciales.email" required placeholder="Jacobo@gmail.com">
        </div>
        <div class="col-md-4 mb-3">
            <label class="form-label fw-bold">Contraseña</label>
            <input type="password" class="form-control" name="contrasena" [(ngModel)]="credenciales.password" required placeholder="123456789">
        </div>
        <button type="submit" class="btn" [disabled]="!loginForm.form.valid">Login</button>
    </div>
</form>
